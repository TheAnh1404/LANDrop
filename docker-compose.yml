services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: landrop
      POSTGRES_USER: landrop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - landrop_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landrop -d landrop"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      WS_PORT: 3001
      NODE_ENV: production
      DATABASE_URL: jdbc:postgresql://postgres:5432/landrop?user=landrop&password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
    ports:
      - "3000:3000"
      - "3001:3001"
    restart: unless-stopped

volumes:
  landrop_postgres:
